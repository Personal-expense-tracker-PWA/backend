services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string (e.g. from Neon, Supabase or Render Postgres)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated list of allowed frontend origins
      - key: CORS_ORIGIN
        sync: false
